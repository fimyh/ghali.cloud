<div class="floating-language" data-language-menu>
  <button class="floating-language-button" type="button" aria-label="اختر اللغة" aria-controls="language-options-ar" aria-expanded="false" data-language-menu-button>
    <i data-lucide="languages" aria-hidden="true"></i>
    <span class="sr-only">اختر اللغة</span>
  </button>

  <div id="language-options-ar" class="floating-language-options" role="menu" aria-label="اللغات المتاحة" hidden data-language-options>
    <button class="language-option " type="button" role="menuitem" lang="en" data-language-choice="en" >
      <span class="language-code">EN</span><span>English</span>
    </button>
    <button class="language-option " type="button" role="menuitem" lang="fr" data-language-choice="fr" >
      <span class="language-code">FR</span><span>Français</span>
    </button>
    <button class="language-option is-active" type="button" role="menuitem" lang="ar" dir="rtl" data-language-choice="ar" aria-current="true">
      <span class="language-code">AR</span><span>العربية</span><i data-lucide="check" aria-hidden="true"></i>
    </button>
  </div>
</div>
